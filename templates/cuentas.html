<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas · API Dashboard</title>

    <!-- Fuentes e Íconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/cuentas.css') }}">
</head>
<body data-page="cuentas">

    <nav class="navbar">
        <a class="nav-brand" href="/"><i class="fa-solid fa-layer-group"></i> API Dashboard</a>
        <ul class="nav-links">
            <li><a href="/" class="{{ 'active' if request.path == '/' }}"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="/marketplaces" class="{{ 'active' if request.path == '/marketplaces' }}"><i class="fa-solid fa-store"></i> Marketplaces</a></li>
            <li><a href="/cuentas" class="{{ 'active' if request.path == '/cuentas' }}"><i class="fa-solid fa-users"></i> Cuentas</a></li>
            <li><a href="/autenticaciones" class="{{ 'active' if request.path == '/autenticaciones' }}"><i class="fa-solid fa-key"></i> Autenticaciones</a></li>
            <li><a href="/endpoints" class="{{ 'active' if request.path == '/endpoints' }}"><i class="fa-solid fa-network-wired"></i> Endpoints</a></li>
            <li><a href="/historial" class="{{ 'active' if request.path == '/historial' }}"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
        </ul>
    </nav>

    <main class="content">
<div class="page-head">
    <h1>Cuentas</h1>
</div>

<form id="form-cuenta" class="card form-grid">
    <label>Marketplace
        <!-- Se llena solo desde la base de datos -->
        <select id="cuenta-mkt" required>
            <option value="">Cargando…</option>
        </select>
    </label>
    <label>Nombre de la cuenta
        <input type="text" id="cuenta-nombre" maxlength="120" required>
    </label>
    <label>URL base
        <input type="url" id="cuenta-url" placeholder="https://">
    </label>
    <div class="form-actions">
        <button type="submit" class="btn-sm primary" id="btn-agregar">Agregar cuenta</button>
        <span class="form-msg" id="form-msg" role="alert"></span>
    </div>
</form>

<div class="toolbar">
    <label>Filtrar
        <select id="cuentas-filtro">
            <option value="">Todos los marketplaces</option>
        </select>
    </label>
</div>

<div id="cuentas-list"><p class="empty">Cargando…</p></div>
    </main>

    <script src="{{ url_for('static', filename='JS/cuentas.js') }}" defer></script>
</body>
</html>
